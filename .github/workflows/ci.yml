name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONUTF8: "1"

jobs:
  validate-template:
    name: Render + AST (all-pairs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias de validación
        run: pip install jinja2 pyyaml

      - name: Validar copier.yml
        run: python .github/scripts/check_copier.py

      # El generador decide QUE se prueba. Si se rompe en silencio, la
      # cobertura cae y todo sigue en verde.
      - name: Autotest del generador all-pairs
        run: python .github/scripts/pairwise.py --self-test

      - name: Render + AST
        run: python .github/scripts/validate_template.py

  smoke-java:
    name: Smoke Java (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: validate-template
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar copier
        run: pip install copier pyyaml

      - name: Escribir data file
        run: |
          cat > /tmp/java-data.yml <<'YAML'
          language: java
          project_name: Proyecto Java CI
          project_slug: proyecto_java_ci
          project_author_name: CI
          project_author_email: ci@test.com
          project_description: Render Java para CI
          base_package: com.ci.proyectojava
          java_version: "17"
          framework: spring-boot-batch
          db: h2
          migrations: flyway
          YAML

      - name: Generar proyecto Java
        run: |
          copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file /tmp/java-data.yml \
            . /tmp/java-generated

      - name: Puerta del arnés (build + tests + cobertura)
        working-directory: /tmp/java-generated
        run: bash ./init.sh
