name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONUTF8: "1"

jobs:
  validate-template:
    name: Render + AST (all-pairs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias de validación
        run: pip install jinja2 pyyaml

      - name: Validar copier.yml
        run: python .github/scripts/check_copier.py

      # El generador decide QUE se prueba. Si se rompe en silencio, la
      # cobertura cae y todo sigue en verde.
      - name: Autotest del generador all-pairs
        run: python .github/scripts/pairwise.py --self-test

      - name: Render + AST
        run: python .github/scripts/validate_template.py

  smoke-java:
    name: Smoke Java (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: validate-template
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar copier
        run: pip install copier pyyaml

      - name: Escribir data file
        run: |
          cat > /tmp/java-data.yml <<'YAML'
          language: java
          project_name: Proyecto Java CI
          project_slug: proyecto_java_ci
          project_author_name: CI
          project_author_email: ci@test.com
          project_description: Render Java para CI
          base_package: com.ci.proyectojava
          java_version: "17"
          framework: spring-boot-batch
          db: h2
          migrations: flyway
          YAML

      - name: Generar proyecto Java
        run: |
          copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file /tmp/java-data.yml \
            . /tmp/java-generated

      - name: Puerta del arnés (build + tests + cobertura)
        working-directory: /tmp/java-generated
        run: bash ./init.sh

  adopt-existing-java:
    name: Adopt existing Java project (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: validate-template
    strategy:
      fail-fast: false
      matrix:
        stack: [spring-boot, spring-boot-batch]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias del adoptador
        run: pip install copier pyyaml

      - name: Generar una aplicación de prueba
        run: |
          cat > /tmp/seed-data.yml <<YAML
          language: java
          project_name: Existing ${{ matrix.stack }}
          project_slug: existing_${{ matrix.stack == 'spring-boot-batch' && 'batch' || 'web' }}
          project_author_name: CI
          project_author_email: ci@test.com
          project_description: Proyecto existente para E2E
          base_package: com.ci.existing
          java_version: "17"
          framework: ${{ matrix.stack }}
          db: h2
          migrations: flyway
          YAML
          copier copy --trust --defaults --skip-tasks \
            --data-file /tmp/seed-data.yml . /tmp/seed
          mkdir -p /tmp/adopted
          cp -a /tmp/seed/src /tmp/adopted/
          cp -a /tmp/seed/.mvn /tmp/adopted/
          cp /tmp/seed/pom.xml /tmp/seed/mvnw /tmp/seed/mvnw.cmd /tmp/adopted/

      - name: Adoptar sin tocar el scaffold
        run: python tools/adopt.py /tmp/adopted

      - name: Verificar puerta y evals del arnés
        working-directory: /tmp/adopted
        run: |
          bash ./init.sh
          PYTHONUTF8=1 uv run --no-project python -m agents.evals.runner --harness --contracts
