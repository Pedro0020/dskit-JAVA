plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = '{{ base_package }}'
version = '{{ project_version }}'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of({{ java_version }})
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
{% if framework != 'spring-boot-batch' %}
    implementation 'org.springframework.boot:spring-boot-starter-web'
{% endif %}
{% if 'batch' in framework %}
    implementation 'org.springframework.boot:spring-boot-starter-batch'
{% endif %}
{% if db == 'h2' %}
    runtimeOnly 'com.h2database:h2'
{% elif db == 'postgres' %}
    runtimeOnly 'org.postgresql:postgresql'
{% elif db == 'mysql' %}
    runtimeOnly 'com.mysql:mysql-connector-j'
{% endif %}
{% if db != 'h2' %}
    // Los tests corren contra H2 en memoria (application-test.yml) aunque la
    // BD de produccion sea otra: contextLoads no debe exigir un servicio.
    testRuntimeOnly 'com.h2database:h2'
{% endif %}
{% if migrations == 'flyway' %}
    implementation 'org.flywaydb:flyway-core'
{% if db == 'postgres' %}
    implementation 'org.flywaydb:flyway-database-postgresql'
{% endif %}
{% elif migrations == 'liquibase' %}
    implementation 'org.liquibase:liquibase-core'
{% endif %}
{% if use_security %}
    implementation 'org.springframework.boot:spring-boot-starter-security'
{% endif %}
{% if use_observability %}
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
{% endif %}
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
{% if 'batch' in framework %}
    testImplementation 'org.springframework.batch:spring-batch-test'
{% endif %}
{% if use_testcontainers %}
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
{% if db == 'postgres' %}
    testImplementation 'org.testcontainers:postgresql'
{% endif %}
{% endif %}
{% if use_archunit %}
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
{% endif %}
}

tasks.named('test') {
    useJUnitPlatform {
        if (project.hasProperty('smoke')) {
            includeTags 'smoke'
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

// Umbral de cobertura (0.80 = 80%). Configurable por CLI:
// ./gradlew build -PcoverageMin=0.70
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = (findProperty('coverageMin') ?: '0.80') as BigDecimal
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: '**/Application.class')
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

spotless {
    java {
        palantirJavaFormat()
        removeUnusedImports()
    }
}

