# CI workflow for {{ project_name }} — Java (Spring Boot)
# Generated by dskit-JAVA (fork of dskit — https://github.com/cacelass/dskit)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build + tests + cobertura
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["{{ java_version }}"{% if java_version == '17' %}, "21"{% endif %}]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK {% raw %}${{ matrix.java }}{% endraw %}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: {% raw %}${{ matrix.java }}{% endraw %}
          cache: {% if build_tool == 'maven' %}maven{% else %}gradle{% endif %}

      - name: Build, tests y cobertura
        run: {% if build_tool == 'maven' %}./mvnw -B verify{% else %}./gradlew build{% endif %}

      - name: Publicar informe JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-{% raw %}${{ matrix.java }}{% endraw %}
          path: {% if build_tool == 'maven' %}target/site/jacoco/{% else %}build/reports/jacoco/test/html/{% endif %}

  harness:
    name: Evals del arnés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      # El arnés se autoverifica en CI, igual que en el template Python: si un
      # agente se rompe o los contratos se pisan, el proyecto lo sabe.
      - name: Evals (harness + contracts + routing)
        run: uv run --no-project python -m agents.evals.runner --harness --routing --contracts

      - name: Prompts en sync
        run: uv run --no-project python -m agents.prompts_sync

      - name: Tests de los agentes
        run: uv run --no-project --with pytest --with hypothesis python -m pytest agents/tests -q

  security:
    name: SBOM + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{ java_version }}"
          cache: {% if build_tool == 'maven' %}maven{% else %}gradle{% endif %}

{% if build_tool == 'maven' %}
      - name: SBOM (cyclonedx)
        run: ./mvnw -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
{% endif %}
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
{% if use_pit and build_tool == 'maven' %}
  mutation:
    name: PIT (mutation testing)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{ java_version }}"
          cache: maven

      - name: PIT sobre el paquete base
        run: ./mvnw org.pitest:pitest-maven:1.17.0:mutationCoverage -DtargetClasses={{ base_package }}.** -DoutputFormats=XML,HTML

      - name: Publicar informe PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit
          path: target/pit-reports/
{% endif %}
