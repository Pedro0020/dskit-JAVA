{% if language == 'java' %}
# CI workflow for {{ project_name }} — Java (Spring Boot)
# Generated by dskit-JAVA (fork of dskit — https://github.com/cacelass/dskit)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build + tests + cobertura
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["{{ java_version }}"{% if java_version == '17' %}, "21"{% endif %}]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK {% raw %}${{ matrix.java }}{% endraw %}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: {% raw %}${{ matrix.java }}{% endraw %}
          cache: {% if build_tool == 'maven' %}maven{% else %}gradle{% endif %}

      - name: Build, tests y cobertura
        run: {% if build_tool == 'maven' %}./mvnw -B verify{% else %}./gradlew build{% endif %}

      - name: Publicar informe JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-{% raw %}${{ matrix.java }}{% endraw %}
          path: {% if build_tool == 'maven' %}target/site/jacoco/{% else %}build/reports/jacoco/test/html/{% endif %}

  harness:
    name: Evals del arnés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      # El arnés se autoverifica en CI, igual que en el template Python: si un
      # agente se rompe o los contratos se pisan, el proyecto lo sabe.
      - name: Evals (harness + contracts + routing)
        run: uv run --no-project python -m agents.evals.runner --harness --routing --contracts

      - name: Prompts en sync
        run: uv run --no-project python -m agents.prompts_sync

      - name: Tests de los agentes
        run: uv run --no-project --with pytest --with hypothesis --with numpy --with matplotlib python -m pytest agents/tests -q

  security:
    name: SBOM + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{ java_version }}"
          cache: {% if build_tool == 'maven' %}maven{% else %}gradle{% endif %}

{% if build_tool == 'maven' %}
      - name: SBOM (cyclonedx)
        run: ./mvnw -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
{% endif %}
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
{% if use_pit and build_tool == 'maven' %}
  mutation:
    name: PIT (mutation testing)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{ java_version }}"
          cache: maven

      - name: PIT sobre el paquete base
        run: ./mvnw org.pitest:pitest-maven:1.17.0:mutationCoverage -DtargetClasses={{ base_package }}.** -DoutputFormats=XML,HTML

      - name: Publicar informe PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit
          path: target/pit-reports/
{% endif %}
{% else %}
# CI workflow for {{ project_name }}
# Generated by dskit-JAVA (fork of dskit — https://github.com/cacelass/dskit)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["{{ python_version }}"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: {% raw %}${{ matrix.python-version }}{% endraw %}

      # `run: |` (bloque literal) y no un escalar plano: YAML pliega los saltos
      # de un escalar plano en espacios, asi que las `\` de continuacion le
      # llegaban al shell como `\ ` — un espacio escapado — y `uv sync` recibia
      # argumentos basura. Rompia el CI de cualquier proyecto con algun extra.
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra {{ ml_type }} \
{% if use_mlflow %}            --extra mlflow_tracking \
{% endif %}{% if graphify_mode != 'no' %}            --extra graphify \
{% endif %}{% if use_api %}            --extra api \
{% endif %}{% if use_duckdb %}            --extra duckdb \
{% endif %}{% if use_optuna %}            --extra optuna \
{% endif %}{% if use_monitoring %}            --extra monitoring \
{% endif %}{% if use_rag %}            --extra rag \
{% endif %}            --frozen

      - name: Lint
        run: uv run ruff check {{ project_slug }}/ tests/

      # Sin `--strict` en la linea: la configuracion vive en pyproject.toml
      # (strict global + relajado para tests/). Pasarlo aqui hacia que CI y tu
      # maquina comprobasen cosas distintas.
      - name: Type check
        run: uv run mypy {{ project_slug }}/ tests/

      # 60 y no 20. Medido sobre proyectos recien generados: supervisado da 74%
      # y no_supervisado 67%, asi que el umbral anterior no era una puerta, era
      # un adorno — cabia borrar dos tercios de los tests sin que CI se
      # inmutase. 60 deja margen a las combinaciones mas flacas sin dejar de
      # ser exigible.
      - name: Test with coverage
        run: uv run pytest tests/ -v --cov={{ project_slug }} --cov-report=xml --cov-fail-under=60

      # Bloqueante a proposito: el arnes exige evidencia para cerrar una
      # feature, pero sus propios tests podian romperse sin que CI se enterase.
      - name: Agent tests
        run: uv run pytest agents/tests/ -v --tb=short

      # La puerta del arnés, en CI. Sin --quick no aportaría nada: los tests
      # ya se ejecutaron arriba y el fallo saldría dos veces.
      - name: Harness gate
        run: |
          chmod +x init.sh
          ./init.sh --quick

      # Los prompts de los agentes se derivan del código y de contracts.py.
      # Si alguien añade una acción y no regenera, esto lo caza.
      - name: Prompts in sync
        run: uv run python -m agents.prompts_sync

      # Solo las suites deterministas. `smoke` ejecuta la accion principal de
      # cada agente y depende del estado del proyecto (datos en data/raw/, un
      # modelo entrenado, un repo git): en uno recien generado falla por
      # motivos legitimos, asi que ahi no mide nada.
      - name: Agent evals
        run: uv run python -m agents.evals.runner --harness --routing --contracts

      - name: Security scan
        run: uv run bandit -r {{ project_slug }}/ -f txt -x tests || true
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
{% endif %}
